name: Banc de nuit

# Mesure la variance de l'agent de la démo, une demi-passe par nuit.
#
# Pourquoi la nuit, et pourquoi une demi-passe : une passe complète consomme
# environ 160 000 jetons, sur un quota gratuit Groq de 200 000 par jour et par
# modèle, partagé avec la page Agent du dashboard. Une demi-passe (20 questions)
# laisse une trentaine de questions par jour à la démo. Dix nuits donnent cinq
# passes valides par question, soit la mesure de variance qui manque au README
# depuis le 2026-09-14.
#
# Chaque nuit :
#   1. prend la tranche la moins avancée (une nuit ratée est rattrapée seule) ;
#   2. ajoute les réponses au journal `evals/journal/` ;
#   3. régénère le rapport `evals/reports/variance/variance.md` ;
#   4. publie les deux sur main.
# Une panne du fournisseur ne compte pas comme une passe : la question est
# reposée une autre nuit (voir evals/journal.py).
#
# Le workflow s'arrête de lui-même quand la mesure est complète, et ne fait rien
# tant que le secret GROQ_API_KEY n'est pas configuré.

on:
  schedule:
    # 1 h UTC, soit 3 h à Paris : personne n'utilise la démo.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banc-de-nuit
  cancel-in-progress: false

env:
  JOURNAL: evals/journal/gpt-oss-120b.jsonl
  MODELE: openai/gpt-oss-120b
  CIBLE: "5"

jobs:
  banc:
    name: Demi-passe du banc
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt httpx duckdb pyyaml openai

      - name: Faut-il mesurer cette nuit ?
        id: etat
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "### ⏸️ Secret GROQ_API_KEY absent : rien à mesurer" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(python -m evals.aggregate "$JOURNAL" --status --target "$CIBLE")" = "complet" ]; then
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ Mesure complète : $CIBLE passes valides par question" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "lancer=true" >> "$GITHUB_OUTPUT"
          echo "tranche=$(python -m evals.aggregate "$JOURNAL" --next-tranche 2)" >> "$GITHUB_OUTPUT"

      - name: Demi-passe, puis agrégat
        if: steps.etat.outputs.lancer == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # L'agent lit les fichiers du dépôt, comme la vérité terrain.
          SCOUTING_REFRESH_SNAPSHOTS: "0"
          SCOUTING_LLM_MAX_RETRIES: "6"
        run: |
          python -m evals.run --provider groq --model "$MODELE" --runs 1 --quiet \
            --tranche "${{ steps.etat.outputs.tranche }}/2" --journal "$JOURNAL" --out /tmp/rapport-nuit
          python -m evals.aggregate "$JOURNAL" --target "$CIBLE" --out evals/reports/variance > /dev/null
          {
            echo "### Tranche ${{ steps.etat.outputs.tranche }}/2 passée"
            echo ""
            head -4 evals/reports/variance/variance.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le journal et le rapport sur main
        if: steps.etat.outputs.lancer == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$JOURNAL" evals/reports/variance/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(banc): demi-passe de nuit, tranche ${{ steps.etat.outputs.tranche }}/2"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
