name: Data Refresh

# Rafraîchissement hebdomadaire des snapshots du dashboard :
# télécharge les CSV Oracle's Elixir, ré-exécute tout le pipeline
# (nettoyage → features → Talent Score → clustering) et ouvre une PR
# avec les artefacts régénérés de reports/metrics/.
#
# Notes de conception :
# - requirements.txt complet (xgboost + umap-learn) pour que les snapshots
#   soient identiques à un run local ; runtime attendu ≈ 10-20 min
#   (~175 Mo de téléchargement + RandomizedSearchCV 60×5 sur ~740 lignes).
# - Limitation GitHub : une PR créée avec GITHUB_TOKEN ne déclenche PAS le
#   workflow CI. Pour que la CI tourne sur la PR de refresh, créer un PAT
#   fine-grained (contents + pull-requests en écriture) dans le secret
#   DATA_REFRESH_TOKEN ; sinon lancer la CI manuellement (workflow_dispatch).
# - create-pull-request est un no-op s'il n'y a aucun diff ; generated_at
#   (date seule) change à chaque run, donc une PR s'ouvre chaque semaine et
#   porte au minimum la mise à jour de fraîcheur.
# - Deux issues distinctes sont possibles, et elles ne se traitent pas pareil :
#     * source indisponible (quota Google Drive du compte Oracle's Elixir) :
#       le téléchargement sort en code 75, le run se termine EN VERT avec une
#       note dans le résumé, et personne n'est alerté. Constaté le 2026-09-03 :
#       le quota bloque tous leurs fichiers, y compris ceux de 2016.
#       ⚠️ Nuance vérifiée le même jour : ce quota ne vise que les accès
#       ANONYMES. Un navigateur connecté à un compte Google télécharge le
#       fichier sans problème. Piste ouverte, non testée : passer par l'API
#       Drive avec un compte de service (clé en secret de dépôt), ce qui
#       rendrait le refresh de nouveau pleinement automatique.
#     * pipeline réellement cassé (ID mort, fichier corrompu, dérive de schéma) :
#       code de sortie 1, run rouge, et commentaire sur l'issue de suivi.

on:
  schedule:
    # Lundi et jeudi. Deux passages plutôt qu'un : le quota Google Drive de
    # la source se libère de façon imprévisible, donc deux fenêtres valent
    # mieux qu'une. Un passage qui ne trouve pas la source se termine en
    # vert sans rien signaler (voir l'étape « Téléchargement des données »).
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Indispensable à la fédération d'identité : c'est cette permission qui
  # autorise le job à demander un jeton OIDC à GitHub, que Google échange
  # ensuite contre un accès. Sans elle, l'étape d'authentification échoue
  # avec un message qui parle de « credentials » et non de permissions.
  id-token: write

jobs:
  refresh:
    name: Pipeline complet + PR snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation des dépendances (complètes)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authentification Google (sans clé, par fédération OIDC)
        # Aucune clé n'est stockée nulle part : GitHub prouve son identité à
        # Google, qui délivre un jeton court. La politique du projet interdit
        # de toute façon la création de clés de compte de service.
        # Le fournisseur n'accepte que le dépôt Bowerlord/Scouting.
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Téléchargement des données
        id: download
        env:
          # Sans ces deux variables, le downloader garde la voie anonyme.
          # C'est ce qui permet à un clone du dépôt de fonctionner sans compte
          # Google, et au workflow de continuer à tourner si l'auth échoue.
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
        run: |
          set +e
          python -m src.data.downloader
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            # 75 = EX_TEMPFAIL : la source est indisponible (quota Google
            # Drive côté Oracle's Elixir). Ce n'est pas un échec du dépôt,
            # donc le run se termine en vert et on ne réveille personne.
            echo "source_unavailable=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏸️ Refresh ignoré : source indisponible"
              echo ""
              echo "Google Drive bloque le partage des fichiers Oracle's Elixir (quota du compte hébergeur)."
              echo "Le blocage touche tous leurs fichiers, y compris les plus anciens : il n'y a rien à corriger ici."
              echo "Les snapshots publiés restent ceux du dernier refresh réussi. Nouvelle tentative au prochain passage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

      - name: Pipeline complet
        if: steps.download.outputs.source_unavailable != 'true'
        run: |
          python -m src.data.cleaner
          python -m src.data.feature_engineering
          python -m src.models.talent_scorer
          python -m src.models.clusterer

      - name: Ouvrir une PR avec les snapshots régénérés
        if: steps.download.outputs.source_unavailable != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DATA_REFRESH_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: |
            reports/metrics/*.csv
            reports/metrics/*.json
          branch: chore/data-refresh
          delete-branch: true
          commit-message: "chore(data): rafraîchissement hebdomadaire des snapshots Oracle's Elixir"
          title: "chore(data): rafraîchissement des snapshots"
          body: |
            PR automatique générée par le workflow Data Refresh.

            Vérifier avant merge :
            - les métriques dans `reports/metrics/talent_score_results.json`
              (PR-AUC cohérent avec les runs précédents),
            - la date `data_max_date` dans `reports/metrics/refresh_metadata.json`.

      - name: Signaler l'échec (une seule issue de suivi, mise à jour)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # Une seule issue de suivi, ré-utilisée à chaque échec.
          # Avant : une issue neuve chaque semaine pour la même cause,
          # donc un mail hebdomadaire et 8 issues ouvertes en un mois.
          TITLE="Data Refresh en échec (issue de suivi)"
          BODY="Échec du run du $(date +%F) : $RUN_URL

          Causes possibles, par fréquence réelle observée :
          1. **Quota Google Drive dépassé** — Google renvoie une page HTML \`Quota exceeded\` au lieu du CSV : le compte qui héberge les fichiers d'Oracle's Elixir a dépassé son quota de partage. Le run suivant peut passer. À savoir : ce quota ne frappe que les accès anonymes, un navigateur connecté télécharge le fichier normalement, donc une acquisition via l'API Drive authentifiée reste une piste.
          2. ID Google Drive expiré ou partage modifié (\`GOOGLE_DRIVE_IDS\` dans \`src/config.py\`).
          3. Dérive réelle du schéma Oracle's Elixir (\`src/data/schema.py\`).

          Le log du run dit lequel des trois s'applique : le téléchargement s'arrête maintenant avec la cause exacte, au lieu de laisser le pipeline échouer trois étapes plus loin sur une fausse dérive de schéma."

          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
