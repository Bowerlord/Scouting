# Thème d'ERL Scout.
#
# Refondu le 2026-09-07, direction « liste de surveillance ».
#
# Deux rendus ont été écartés parce que ce sont des réflexes et non des choix :
# le fond crème avec serif contrastée, et le noir pur avec accent acide. Le
# premier jet de la journée était le second, et il ressemblait à tout.
#
# Ici, un gris froid de salle de régie, ni noir ni bleuté, et un seul accent
# orange brûlé qui n'apparaît qu'à un endroit : le marqueur de promotion en LEC.
# Le reste de la hiérarchie se fait par la valeur et la position, pas par la
# couleur.

[theme]
base = "dark"
# primaryColor peint TOUS les widgets Streamlit : curseurs, cases, etiquettes.
# Y mettre la couleur d'accent la repandait partout, alors qu'elle doit
# signaler une seule chose. On met donc un gris neutre ici, et l'accent
# n'apparait que la ou le CSS du projet le place : le marqueur de promotion.
primaryColor = "#AEB6C2"
backgroundColor = "#14161A"
secondaryBackgroundColor = "#1B1E23"
textColor = "#DDE1E6"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
